; ESP32 MQTT telemetry node
; https://docs.platformio.org/page/projectconf.html
;
; Two boards are supported. `pio run` builds the default one;
; use `pio run -e esp32dev` for a classic ESP32 DevKit.

[platformio]
default_envs = nano_esp32

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.0

; Arduino Nano ESP32 (ESP32-S3)
[env:nano_esp32]
board = arduino_nano_esp32

; Classic ESP32 DevKit (ESP32-WROOM)
[env:esp32dev]
board = esp32dev
